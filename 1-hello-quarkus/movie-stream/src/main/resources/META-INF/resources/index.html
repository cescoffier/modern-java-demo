<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Movie stream demo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Stream | IBM Demo</title>

    <!-- IBM Plex Sans font from IBM CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Carbon Design System v11 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@carbon/styles@1.50.0/css/styles.css">

    <style>
        :root {
            --cds-font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --cds-font-family-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
        }

        body {
            font-family: var(--cds-font-family);
            background-color: #f4f4f4;
            color: #161616;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Carbon UI Shell Header */
        .cds--header {
            position: sticky;
            top: 0;
            z-index: 8000;
            background-color: #161616;
            color: #ffffff;
            height: 3rem;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 1px solid #393939;
        }

        .cds--header__name {
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.16px;
            color: #f4f4f4;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        .cds--header__name--prefix {
            font-weight: 600;
            margin-right: 0.25rem;
        }

        .cds--header__badge {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            font-family: var(--cds-font-family-mono);
            color: #8d8d8d;
        }

        .cds--status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #24a148;
            box-shadow: 0 0 0 2px rgba(36, 161, 72, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Main Container */
        .cds--content {
            max-width: 1312px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem 1.5rem;
            box-sizing: border-box;
            flex: 1;
        }

        .cds--page-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .cds--page-header__label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.32px;
            text-transform: uppercase;
            color: #525252;
            margin-bottom: 0.25rem;
        }

        .cds--page-header__title {
            font-size: 2rem;
            font-weight: 300;
            line-height: 1.25;
            color: #161616;
            margin: 0 0 0.5rem 0;
        }

        .cds--page-header__title strong {
            font-weight: 600;
        }

        .cds--page-header__description {
            font-size: 0.875rem;
            color: #525252;
            margin: 0;
        }

        /* Movie Grid */
        .cds--movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Carbon-styled Movie Tile / Card */
        .cds--movie-tile {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-top: 3px solid #0f62fe;
            display: flex;
            flex-direction: column;
            transition: all 0.15s cubic-bezier(0.2, 0, 0.38, 0.9);
            position: relative;
            box-sizing: border-box;
        }

        .cds--movie-tile:hover {
            border-color: #0f62fe;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .cds--movie-tile__cover-wrapper {
            width: 100%;
            height: 380px;
            background-color: #262626;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cds--movie-tile__cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }

        .cds--movie-tile:hover .cds--movie-tile__cover {
            transform: scale(1.02);
        }

        .cds--movie-tile__body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .cds--movie-tile__title {
            font-size: 1.125rem;
            font-weight: 600;
            line-height: 1.35;
            color: #161616;
            margin: 0 0 0.75rem 0;
            word-break: break-word;
        }

        .cds--movie-tile__metadata {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid #f4f4f4;
        }

        /* Carbon Tags */
        .cds--tag {
            display: inline-flex;
            align-items: center;
            min-height: 1.5rem;
            padding: 0 0.5rem;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.32px;
            line-height: 1;
            border-radius: 0.75rem;
        }

        .cds--tag--teal {
            background-color: #d9fbfb;
            color: #005d5d;
        }

        .cds--tag--blue {
            background-color: #edf5ff;
            color: #0043ce;
        }

        .cds--tag--rating {
            background-color: #fff8e1;
            color: #8a6d00;
            font-weight: 600;
        }

        /* Empty state */
        .cds--empty-state {
            grid-column: 1 / -1;
            padding: 3rem 1rem;
            text-align: center;
            color: #6f6f6f;
            background: #ffffff;
            border: 1px dashed #c6c6c6;
        }
    </style>
</head>

<body>
    <header class="cds--header">
        <a class="cds--header__name" href="#">
            <span class="cds--header__name--prefix">IBM</span> Demo &mdash; Movie Stream
        </a>
        <div class="cds--header__badge">
            <span class="cds--status-indicator" title="Connected to SSE stream"></span>
            <span>Live Stream</span>
        </div>
    </header>

    <main class="cds--content">
        <section class="cds--page-header">
            <div class="cds--page-header__label">Quarkus Movie Streamer</div>
            <h1 class="cds--page-header__title">Featured <strong>Movies</strong></h1>
            <p class="cds--page-header__description">HTTP -> Movie Rater -> Kafka -> Movie Streamer -> Remote Service Call -> SSE</p>
        </section>

        <section id="movies" class="cds--movie-grid">
            <!-- Movie cards injected dynamically -->
        </section>
    </main>

    <script>
        window.onload = function () {
            retrieveMovies();
            listenForUpdates();
        };

        function listenForUpdates() {
            let eventSource = new EventSource("/movies/stream");
            eventSource.onmessage = function (event) {
                retrieveMovies();
            };
        }

        function retrieveMovies() {
            return fetch('/movies')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById("movies");
                    container.innerHTML = "";

                    if (!data || data.length === 0) {
                        const empty = document.createElement("div");
                        empty.className = "cds--empty-state";
                        empty.textContent = "No movies available in the repository.";
                        container.appendChild(empty);
                        return;
                    }

                    data.forEach(movie => {
                        const tile = document.createElement("article");
                        tile.className = "cds--movie-tile";

                        const coverWrapper = document.createElement("div");
                        coverWrapper.className = "cds--movie-tile__cover-wrapper";

                        const img = document.createElement("img");
                        img.className = "cds--movie-tile__cover";
                        img.setAttribute("src", movie.cover || "");
                        img.setAttribute("alt", movie.title || "Movie cover");
                        coverWrapper.appendChild(img);

                        const body = document.createElement("div");
                        body.className = "cds--movie-tile__body";

                        const title = document.createElement("h3");
                        title.className = "cds--movie-tile__title";
                        title.textContent = movie.title;

                        const meta = document.createElement("div");
                        meta.className = "cds--movie-tile__metadata";

                        const ratingTag = document.createElement("span");
                        ratingTag.className = "cds--tag cds--tag--rating";
                        ratingTag.textContent = "★ " + movie.rating;

                        const yearTag = document.createElement("span");
                        yearTag.className = "cds--tag cds--tag--blue";
                        yearTag.textContent = "Year: " + movie.year;

                        meta.appendChild(ratingTag);
                        meta.appendChild(yearTag);

                        body.appendChild(title);
                        body.appendChild(meta);

                        tile.appendChild(coverWrapper);
                        tile.appendChild(body);

                        container.appendChild(tile);
                    });
                })
                .catch(err => {
                    console.error("Error retrieving movies:", err);
                });
        }
    </script>
</body>

</html>
